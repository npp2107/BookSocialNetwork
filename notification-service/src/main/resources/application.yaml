server:
    port: 8082
    servlet:
        context-path: /notification

openapi:
    service:
        api-docs: notification-api-service
        server: http://localhost:8082/notification
        title: Notification API Service
        version: 1.0.0

notification:
    email:
        brevo-url: https://api.brevo.com
        brevo-apikey: "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"
spring:
    application:
        name: notification-service
    data:
        mongodb:
            uri: mongodb://root:root@localhost:27017/notification-service?authSource=admin
    kafka:
        bootstrap-servers: localhost:9094
        consumer:
            group-id: notification-group
            auto-offset-reset: earliest
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer