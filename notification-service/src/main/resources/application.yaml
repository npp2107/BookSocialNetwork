server:
    port: 8082
    servlet:
        context-path: /notification

openapi:
    service:
        api-docs: notification-api-service
        server: http://localhost:8082/notification
        title: Notification API Service
        version: 1.0.0

spring:
    application:
        name: notification-service
    data:
        mongodb:
            uri: mongodb://root:root@localhost:27017/notification-service?authSource=admin
    kafka:
        bootstrap-servers: localhost:9094
        consumer:
            group-id: notification-group
            auto-offset-reset: earliest
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            properties:
                spring.json.trusted.packages: "*"
    config:
        import: classpath:brevo-config.yaml